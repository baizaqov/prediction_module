Deployment:
  resources:
    limits:
      cpu: 4
      memory: 4Gi
    requests:
      cpu: "200m"
      memory: 200Mi
  livereadProbeType:
    httpGet:
      enabled: false

# Форкаст-специфичные переменные окружения (в дополнение к общему gisbb-config через envFrom).
# EUREKA_ENABLED по умолчанию false; в кластере обязателен true, иначе сервис не
# регистрируется в Eureka и шлюз на маршруте lb://gisbb-forecast отдаёт 503.
# Зону реестра (EUREKA_CLIENT_SERVICEURL_DEFAULTZONE) и SERVER_PORT=8080 сервис берёт
# из общего ConfigMap gisbb-config.
environment:
  - name: EUREKA_ENABLED
    value: "true"

Service:
  type: ClusterIP
  port: 8080

ConfigMap:
  enabled: false
  name: gisbb-config

Secret:
  enabled: false
  name: gisbb-secret

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
